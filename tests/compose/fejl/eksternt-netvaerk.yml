# Bryder kun reglen `eksternt-netvaerk`: et andet eksternt netvaerk end
# proxy-netvaerket. Proxy-netvaerket selv er tilladt og staar ved siden af.
services:
  web:
    image: ghcr.io/hjk-automatisering/example-app:1.4.2
    labels:
      hjk.kontakt: "${CONTACT_EMAIL}"
    restart: unless-stopped
    networks:
      shared-backend:
      proxy:
        aliases:
          - example-app
    mem_limit: 512m
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  shared-backend:
    external: true
  proxy:
    external: true
