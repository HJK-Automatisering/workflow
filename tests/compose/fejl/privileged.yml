# Bryder kun reglen `privileged`.
services:
  web:
    image: ghcr.io/hjk-automatisering/example-app:1.4.2
    labels:
      hjk.kontakt: "${CONTACT_EMAIL}"
    privileged: true
    restart: unless-stopped
    network_mode: bridge
    mem_limit: 512m
    logging:
      options:
        max-size: "10m"
        max-file: "3"
