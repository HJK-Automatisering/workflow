# Bryder kun reglen `restart`: manglende, og `no`. (`restart: false` afvises
# af docker compose selv, saa den variant staar ikke her; scriptet fanger den
# alligevel, hvis en YAML 1.1-laeser goer `no` til False.)
services:
  web:
    image: ghcr.io/hjk-automatisering/example-app:1.4.2
    mem_limit: 512m
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    image: ghcr.io/hjk-automatisering/example-app:1.4.2
    restart: no
    mem_limit: 512m
    logging:
      options:
        max-size: "10m"
        max-file: "3"
