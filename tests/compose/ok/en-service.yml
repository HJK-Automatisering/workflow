# Én service bag proxyen: den staar kun paa proxy-netvaerket, og stacken
# opretter intet netvaerk selv. Uden `default` er der ikke noget at optage.
services:
  web:
    image: ghcr.io/hjk-automatisering/example-app:1.4.2
    restart: unless-stopped
    networks:
      nginx-proxy-manager_default:
        aliases:
          - example-app
    mem_limit: 512m
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  nginx-proxy-manager_default:
    external: true
