name: Deploy update (reusable)

# Genbrugeligt workflow. Kaldes af projekternes deploy-job efter build-jobbet
# i deres egen .github/workflows/docker-publish.yaml — se caller-eksemplet i
# README.
#
# Udrulning sker via Portainer, der følger `main` i app-repoet og læser
# deploy/docker-compose.yml. Produktionsserveren kan ikke nås fra GitHub, og
# dette workflow forsøger det heller ikke. Dets eneste opgave er at skrive
# den nye, verificerede image-version ind i compose-filen på `main`. Den
# commit er det, der udløser udrulningen.
#
# Ét image med flere services (fx web og worker fra samme Dockerfile) er ét
# kald med `service: web,worker`, så én release giver én commit og dermed én
# udrulning i Portainer. Repos med flere images kalder workflowet én gang pr.
# image. Støder to kald sammen på push, klarer retry-trinnet nederst det.

on:
  workflow_call:
    # Inputnavne bruger _ og ikke -. I GitHub-udtryk læses `inputs.compose-path`
    # som et minus, og så skal man skrive inputs['compose-path'] overalt.
    inputs:
      compose_path:
        description: 'Sti til compose-filen i det kaldende repo.'
        type: string
        default: 'deploy/docker-compose.yml'
      service:
        description: 'Navnet på servicen under services:, hvis image-felt skal opdateres. Flere services adskilles med komma (web,worker); alle skal pege på samme image-navn som det, der skrives.'
        type: string
        required: true
      image:
        description: 'Fuld image-reference uden tag, med registry og små bogstaver. Tag outputtet `image` fra docker-publish.yaml.'
        type: string
        required: true
      digest:
        description: 'Digest på det byggede image. Tag outputtet `digest` fra docker-publish.yaml. Det er digesten der verificeres — ikke tagget.'
        type: string
        required: true
      version:
        description: 'Versionen uden v, fx 1.2.3. Tag outputtet `version` fra docker-publish.yaml. Skrives som <image>:<version> i compose-filen.'
        type: string
        required: true

# Bemærk: ingen `concurrency` her, og ingen `secrets:`. Concurrency hører i
# det kaldende workflow. GITHUB_TOKEN er automatisk tilgængeligt og rækker,
# fordi `main` i de berørte repos ikke er beskyttet — se README-afsnittet
# "Hvis `main` beskyttes", hvis det ændrer sig.

jobs:
  deploy-update:
    runs-on: ubuntu-latest

    # Et hængende registry-opslag eller push skal ikke holde kalderen i
    # timevis. Alt herinde er små netværkskald.
    timeout-minutes: 15

    # Kan ikke overstige det kaldende jobs rettigheder — de skal derfor også
    # sættes i caller-workflowet. contents: write til commit på main;
    # packages: read fordi pakkerne er private, og uden login ligner en 401
    # en manglende signatur. Verifikation med cosign kræver ikke id-token.
    permissions:
      contents: write
      packages: read

    env:
      COMPOSE_PATH: ${{ inputs.compose_path }}
      SERVICE: ${{ inputs.service }}
      IMAGE: ${{ inputs.image }}
      DIGEST: ${{ inputs.digest }}
      VERSION: ${{ inputs.version }}
      # github-konteksten er det KALDENDE repos, så ref_name er app-repoets tag.
      TAG: ${{ github.ref_name }}
      APP: ${{ github.event.repository.name }}
      # Scriptet hentes fra dette repo i præcis den commit workflowet selv
      # kører fra, så workflow og script aldrig kan komme ud af takt.
      WORKFLOW_REPO_DIR: .workflow-repo

    steps:
      # Allerførste trin, før der hentes noget. GitHub-udtryk har ikke regex,
      # så kalderens `if: startsWith(github.ref, 'refs/tags/v')` er kun grov.
      # Den præcise kontrol af vX.Y.Z ligger her: et forhåndstag som
      # v1.2.3-rc1 bygges af build-jobbet, men udrulles ikke — og det er ikke
      # en fejl, så kørslen afsluttes grønt.
      - name: Afgør om tagget skal udrulles
        id: release
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "${TAG} er et release-tag. ${SERVICE} opdateres til ${VERSION}."
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::'${TAG}' er ikke et release-tag på formen vX.Y.Z og udrulles ikke. Imaget er bygget; compose-filen røres ikke."
          fi

      # main tjekkes ud — ikke tagget, som er en løsrevet commit. Fuld historik
      # fordi næste trin skal afgøre om tag-commit'en kan nås fra main.
      - name: Checkout main
        if: steps.release.outputs.release == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      # Et tag på en feature-gren må ikke kunne sende et image i drift.
      - name: Tjek at tagget ligger på main
        if: steps.release.outputs.release == 'true'
        id: tag
        run: |
          set -euo pipefail
          tag_sha=$(git rev-parse --verify "refs/tags/${TAG}^{commit}")
          if ! git merge-base --is-ancestor "${tag_sha}" origin/main; then
            echo "::error::Tagget ${TAG} (${tag_sha}) ligger ikke på main. Kun tags på commits der kan nås fra main udrulles. Merge først, og tag derefter."
            exit 1
          fi
          echo "sha=${tag_sha}" >> "$GITHUB_OUTPUT"
          echo "${TAG} peger på ${tag_sha}, som ligger på main."

      # https://github.com/docker/login-action
      - name: Log into registry
        if: steps.release.outputs.release == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN er automatisk tilgængeligt i et genbrugeligt workflow.
          password: ${{ secrets.GITHUB_TOKEN }}

      # Samme SHA og samme cosign-release som i docker-publish.yaml — bumpes
      # sammen. https://github.com/sigstore/cosign-installer
      - name: Install cosign
        if: steps.release.outputs.release == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      # Identiteten i certifikatet (SAN) er det GENBRUGELIGE workflows sti og
      # ref — ikke kalderens. Det er efterprøvet på et signeret image: SAN var
      # https://github.com/HJK-Automatisering/workflow/.github/workflows/docker-publish.yaml@refs/tags/v1
      # Regexp'en kræver derfor netop den sti fra et udgivet tag (refs/tags/v…),
      # så kun images bygget gennem det fælles workflow kan komme i drift.
      # Omdøbes docker-publish.yaml, skal regexp'en rettes med.
      #
      # Kilde-repoet står i certifikatets GitHub-extension (1.3.6.1.4.1.57264.1.5)
      # og tjekkes mod det kaldende repo, så repo A ikke kan udrulle repo B's
      # image.
      - name: Verificér signaturen
        if: steps.release.outputs.release == 'true'
        run: |
          set -euo pipefail
          if ! cosign verify \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp '^https://github\.com/HJK-Automatisering/workflow/\.github/workflows/docker-publish\.yaml@refs/tags/v' \
              --certificate-github-workflow-repository "${GITHUB_REPOSITORY}" \
              "${IMAGE}@${DIGEST}"; then
            echo "::error::Signaturen på ${IMAGE}@${DIGEST} kunne ikke verificeres. Kun images signeret af HJK-Automatisering/workflow/.github/workflows/docker-publish.yaml fra et udgivet tag, bygget i ${GITHUB_REPOSITORY}, udrulles. Er imaget bygget med sign: false eller med en lokal kopi af workflowet?"
            exit 1
          fi

      # Compose-filen henviser til imaget med versionstagget, ikke digesten.
      # Så tagget skal faktisk pege på det image der lige blev verificeret —
      # ellers ville et flyttet eller forkert tag kunne sende noget andet i drift.
      - name: Tjek at tagget peger på digesten
        if: steps.release.outputs.release == 'true'
        run: |
          set -euo pipefail
          if ! faktisk=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{.Manifest.Digest}}'); then
            echo "::error::Tagget ${IMAGE}:${VERSION} findes ikke i registryet. Er build-jobbet kørt med on.push.tags, så metadata-action laver versionstagget?"
            exit 1
          fi
          if [[ "${faktisk}" != "${DIGEST}" ]]; then
            echo "::error::${IMAGE}:${VERSION} peger på ${faktisk}, men den verificerede digest er ${DIGEST}. Tagget er flyttet eller bygget et andet sted. Intet udrulles."
            exit 1
          fi
          echo "${IMAGE}:${VERSION} peger på ${DIGEST}."

      # Scriptet hentes fra samme commit som dette workflow kører fra. Repoet
      # er offentligt, så GITHUB_TOKEN fra app-repoet rækker til checkout.
      - name: Checkout workflow-repoet
        if: steps.release.outputs.release == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: HJK-Automatisering/workflow
          ref: ${{ github.job_workflow_sha }}
          path: ${{ env.WORKFLOW_REPO_DIR }}
          persist-credentials: false

      # Scriptet ændrer kun services.<service>.image på de angivne services og
      # bevarer kommentarer og formatering. Fejler én service — findes ikke,
      # intet image-felt, eller peger på et andet image-navn — skrives intet.
      # Exit 3 betyder "stod der allerede" — så kan gen-kørsel af et deploy-job
      # aldrig give en tom commit. Scriptets stdout vises i loggen, og linjen
      # `changed=web,worker` fortæller commit-trinnet hvilke services der
      # faktisk blev ændret, så beskeden ikke nævner en service, der stod der
      # i forvejen.
      - name: Opdatér image-feltet
        if: steps.release.outputs.release == 'true'
        id: update
        run: |
          set -euo pipefail
          if [[ ! -f "${COMPOSE_PATH}" ]]; then
            echo "::error::Compose-filen ${COMPOSE_PATH} findes ikke på main i ${GITHUB_REPOSITORY}. Opret den, eller sæt inputtet compose_path."
            exit 1
          fi
          python -m pip install --quiet -r "${WORKFLOW_REPO_DIR}/requirements.txt"
          rc=0
          output=$(python "${WORKFLOW_REPO_DIR}/scripts/update_compose_image.py" "${COMPOSE_PATH}" "${SERVICE}" "${IMAGE}:${VERSION}") || rc=$?
          # Vis scriptets linjer pr. service i loggen; changed=-linjen er til os.
          if [[ -n "${output}" ]]; then
            grep -v '^changed=' <<<"${output}" || true
          fi
          case "${rc}" in
            0)
              services=$(grep '^changed=' <<<"${output}" | cut -d= -f2-)
              if [[ -z "${services}" ]]; then
                echo "::error::Scriptet meldte en ændring, men ikke hvilke services. Det er en fejl i HJK-Automatisering/workflow, ikke i ${GITHUB_REPOSITORY}."
                exit 1
              fi
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "services=${services}" >> "$GITHUB_OUTPUT"
              ;;
            3)
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Alle angivne services (${SERVICE}) står allerede på ${VERSION} i ${COMPOSE_PATH}. Intet at committe."
              ;;
            *)
              echo "::error::Kunne ikke opdatere ${COMPOSE_PATH}: se fejlen ovenfor. Hver service i '${SERVICE}' skal findes under services:, have et image:-felt og pege på ${IMAGE}. Intet er ændret."
              exit "${rc}"
              ;;
          esac

      # Samme regler som compose-lint.yaml kører i pull requests, her mod
      # filen efter opdateringen og før commit — så en fil der bryder
      # deploy-kontrakten aldrig når main gennem dette workflow, heller ikke
      # hvis nogen har skrevet direkte på main uden om en PR. Scriptet kører
      # selv `docker compose config --no-interpolate`, så tjekket ikke
      # afhænger af hvilke variabler der er sat, og ingen stack.env behøves.
      # ruamel.yaml er installeret i trinnet ovenfor.
      - name: Lint compose-filen
        if: steps.release.outputs.release == 'true' && steps.update.outputs.changed == 'true'
        run: |
          set -euo pipefail
          if ! python "${WORKFLOW_REPO_DIR}/scripts/compose_lint.py" "${COMPOSE_PATH}"; then
            echo "::error::${COMPOSE_PATH} bryder reglerne for compose-filer efter opdateringen — se fejlene ovenfor. Intet er committet. Ret filen på main (reglerne står i README for HJK-Automatisering/workflow under \"Regler for compose-filen\") og kør jobbet igen."
            exit 1
          fi

      # Forfatteren er GitHubs egen bot-identitet, så commit'en kan kendes fra
      # menneskers i loggen. Push med GITHUB_TOKEN udløser ikke nye kørsler,
      # og build kører kun på tags — så der er ingen løkke at værne imod.
      #
      # Konflikt på push betyder normalt at et andet deploy-kald (en anden
      # service) nåede først. Så hentes main igen og der prøves igen, højst tre
      # gange. 403 og "protected branch" er noget andet: det er rettigheder, og
      # det hjælper ikke at prøve igen.
      - name: Commit og push til main
        if: steps.release.outputs.release == 'true' && steps.update.outputs.changed == 'true'
        env:
          TAG_SHA: ${{ steps.tag.outputs.sha }}
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # De services scriptet faktisk ændrede, kommasepareret, i inputtets
          # rækkefølge. Kan være færre end inputtet, hvis nogle stod der allerede.
          SERVICES: ${{ steps.update.outputs.services }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${COMPOSE_PATH}"
          # `web,worker` skrives som `web, worker` i beskeden.
          git commit --quiet -F - <<MSG
          deploy(${APP}): ${SERVICES//,/, } -> ${VERSION}

          Image:  ${IMAGE}:${VERSION}
          Digest: ${DIGEST}
          Build:  ${BUILD_URL}
          Tag:    ${TAG} (${TAG_SHA})
          MSG

          for forsoeg in 1 2 3; do
            if output=$(git push origin HEAD:main 2>&1); then
              echo "${output}"
              echo "Pushet til main i forsøg ${forsoeg}: ${SERVICES//,/, } -> ${VERSION}. Portainer udruller ved næste poll."
              exit 0
            fi
            echo "${output}"
            if grep -qiE '403|protected branch|GH006|GH013' <<<"${output}"; then
              echo "::error::Push til main blev afvist. GITHUB_TOKEN kan ikke skrive til en beskyttet gren. Se afsnittet \"Hvis main beskyttes\" i README for HJK-Automatisering/workflow."
              exit 1
            fi
            if [[ "${forsoeg}" -lt 3 ]]; then
              echo "Push afvist — sandsynligvis en anden commit på main i mellemtiden. Henter main igen og prøver igen."
              if ! git pull --rebase --quiet origin main; then
                git rebase --abort || true
                echo "::error::Konflikt i ${COMPOSE_PATH} under rebase mod main. En anden commit har ændret samme linje. Ret filen på main i hånden og kør jobbet igen."
                exit 1
              fi
            fi
          done
          echo "::error::Push til main lykkedes ikke efter tre forsøg. Kør jobbet igen; opdateringen er ufarlig at gentage."
          exit 1
